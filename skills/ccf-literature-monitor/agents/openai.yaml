interface:
  display_name: "CCF Literature Monitor"
  short_description: "Monitor arXiv, OpenReview, conference feeds, labs, and competitor papers for idea overlap, new-paper tracking, and trend gaps."
  default_prompt: "Apply $ccf-humanization, then $ccf-common; reuse their applicable active rules. Use $ccf-literature-monitor to scan a dated paper window and report new or changed overlap evidence. Distinguish a completed scan from a genuinely scheduled recurring job."
