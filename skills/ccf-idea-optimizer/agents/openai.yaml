interface:
  display_name: "CCF Idea Optimizer"
  short_description: "Turn rough CCF research directions into concrete problem, gap, insight, method, novelty, and evidence plans."
  default_prompt: "Apply $ccf-humanization, then $ccf-common; reuse their applicable active rules. Use $ccf-idea-optimizer to develop the research problem, causal insight, mechanism, and minimum convincing evidence. Ground novelty when needed, explore meaningful alternatives, and keep unrequested numeric scoring out of the result."
