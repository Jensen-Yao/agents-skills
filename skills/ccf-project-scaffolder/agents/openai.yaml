interface:
  display_name: "CCF Project Scaffolder"
  short_description: "Create CCF paper project folders, select or copy LaTeX templates, initialize ccfa.yaml, and prepare artifact directories."
  default_prompt: "Apply $ccf-humanization, then $ccf-common; reuse their applicable active rules. Use $ccf-project-scaffolder to initialize the requested folders, available template, and ccfa.yaml while preserving existing user files and honoring dry-run or no-new-files limits. Resolve existing artifact paths first and create working source/cache/build directories only when needed."
