interface:
  display_name: "CCF Submission Checker"
  short_description: "Check venue format, LaTeX/PDF package readiness, anonymity, metadata, and artifact/reproducibility packages."
  default_prompt: "Apply $ccf-humanization, then $ccf-common; reuse their applicable active rules. Use $ccf-submission-checker to verify applicable venue/year/track rules and actual package artifacts. Distinguish failed, unverified, and non-applicable checks; do not submit or upload the paper."
