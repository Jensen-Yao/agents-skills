name: Check skill updates

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-skill-updates
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify local routing overrides
        run: python scripts/apply_skill_overrides.py --check --root skills

      - name: Compare catalogs and upstreams
        id: check
        shell: bash
        run: |
          set +e
          python scripts/check_skill_updates.py
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

          cat skill-update-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Maintain update issue
        uses: actions/github-script@v9
        env:
          HAS_UPDATES: ${{ steps.check.outputs.has_updates }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const hasUpdates = process.env.HAS_UPDATES === 'true';
            const report = fs.readFileSync('skill-update-report.md', 'utf8');
            const data = JSON.parse(fs.readFileSync('skill-update-report.json', 'utf8'));
            const label = 'skill-update';

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'd97706',
                description: 'Automated reminder that skill catalogs or public upstreams changed'
              });
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            const managedIssues = openIssues.filter(issue => !issue.pull_request);

            if (hasUpdates) {
              const title = `[Skill Update] ${data.update_count} update item(s) available`;
              const primary = managedIssues[0];
              if (primary) {
                if (primary.title !== title || primary.body !== report) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: primary.number,
                    title,
                    body: report
                  });
                }
              } else {
                await github.rest.issues.create({ owner, repo, title, body: report, labels: [label] });
              }

              for (const duplicate of managedIssues.slice(1)) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: duplicate.number,
                  state: 'closed',
                  state_reason: 'not_planned'
                });
              }
            } else {
              for (const issue of managedIssues) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: 'The automated check is clean. Closing this reminder.'
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
              }
            }
