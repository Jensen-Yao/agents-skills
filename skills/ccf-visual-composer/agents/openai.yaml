interface:
  display_name: "CCF Visual Composer"
  short_description: "Compose paper plots and GPT Image 2-first architecture diagrams with editable reconstruction."
  default_prompt: "Apply $ccf-humanization, then $ccf-common; reuse their applicable active rules. Use $ccf-visual-composer for supplied-data plots and scientific diagrams. Use GPT Image 2 for the default architecture concept unless pure SVG/code-first output is requested. Inspect the result and complete already requested editable formats without another confirmation. Preserve data, topology, and labels. Reuse existing editable source and assets for local changes; refresh only affected requested exports. Keep one canonical source and orderly working directory per figure."
