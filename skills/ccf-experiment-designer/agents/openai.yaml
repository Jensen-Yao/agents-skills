interface:
  display_name: "CCF Experiment Designer"
  short_description: "Design protocols, specify authorized runs, and interpret real experimental feedback for research decisions."
  default_prompt: "Activate $ccf-humanization first and $ccf-common second, then use $ccf-experiment-designer for claim-driven protocols, execution specifications, and real-result interpretation. In requested autonomous research, return discriminating comparisons and observed feedback to $ccf-pipeline-orchestrator for host execution and integration. Preserve supplied values and distinguish planned studies, execution failures, invalid comparisons, and scientific results. Concept-only idea review does not acquire experiment requirements."
