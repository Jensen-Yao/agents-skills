interface:
  display_name: "CCF Pipeline Orchestrator"
  short_description: "Coordinate research stages and requested autonomous hypothesis-experiment-feedback loops within task budgets."
  default_prompt: "Apply $ccf-humanization, then $ccf-common; reuse their applicable active rules. Use $ccf-pipeline-orchestrator for the requested plan or authorized end-to-end research. For explicit autonomous research or autoresearch, read autonomous-research.md, coordinate specialists and actual host execution, and use observed feedback to retain, discard, or branch task methods and strategies within the run contract. Preserve the latest goal, evidence versions, canonical paths, and usable results. Do not confuse planning with execution, launch an unrequested background loop, or apply skill-maintenance candidate limits to scientific exploration."
